name: deploy-demo
# Uploads docs/ (the public sample) to Vercel as plain files, with no git metadata,
# so the deploy doesn't depend on who authored the commit.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_kuWilacSACWUr1VyeKR0Ym2K
      VERCEL_PROJECT_ID: prj_GNIRXATKPuYhLvxKUA4kyunbI5AM
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/site" && cp -R docs/. "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          bunx vercel@58.9.1 deploy --prod --yes --token "$VERCEL_TOKEN"
